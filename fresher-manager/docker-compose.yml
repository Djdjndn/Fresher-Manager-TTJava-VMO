version: "3.9"

services:
  app:
    build: .
    image: my-springboot-app:latest
    container_name: spring-app-FresherManager
    ports:
      - "8080:8080"
    environment:
      # KẾT NỐI ĐẾN MYSQL LOCAL - ĐIỀU CHỈNH THEO CẤU HÌNH CỦA BẠN
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/fresherdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: fresher              # HOẶC fresher
      SPRING_DATASOURCE_PASSWORD: abc123            # PASSWORD MYSQL CỦA BẠN
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    restart: unless-stopped

