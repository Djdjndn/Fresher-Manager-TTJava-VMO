# XÓA hoặc COMMENT các dòng database connection trong file này
# spring.datasource.url=jdbc:mysql://localhost:3306/fresherdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=fresher
# spring.datasource.password=abc123

# CHỈ GIỮ LẠI các cấu hình JPA khác
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.application.name=fresher-manager
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DEBUG LOGGING
logging.level.com.example.fresher_manager=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE